<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f7f7f4">
  <title>インタビュー発話のマスキング</title>
  <style>
    :root{color-scheme:light;--paper:#f7f7f4;--panel:#fff;--ink:#252720;--muted:#85877e;--line:#e4e5df;--accent:#405847;--green:#34734b;--red:#999c96;--soft:#eef1eb;--shadow:0 12px 35px #20291d12;font-family:-apple-system,BlinkMacSystemFont,"Hiragino Kaku Gothic ProN","Yu Gothic",Meiryo,sans-serif}
    *{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font-size:15px;line-height:1.8}button,input{font:inherit}button{color:inherit}.app{min-height:100dvh;display:flex;flex-direction:column}.topbar{height:64px;padding:0 clamp(16px,4vw,52px);display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--line);background:#ffffffb8;position:sticky;top:0;z-index:4;backdrop-filter:blur(12px)}.brand{font-size:14px;font-weight:650;letter-spacing:.04em}.top-actions{display:flex;align-items:center;gap:12px}.save-state{font-size:12px;color:var(--muted)}.save-state:before{content:"";display:inline-block;width:7px;height:7px;border-radius:50%;background:#81a487;margin-right:7px}.icon-button,.plain-button{border:1px solid var(--line);background:#fff;border-radius:8px;padding:7px 12px;cursor:pointer;font-size:13px}.icon-button:hover,.plain-button:hover{border-color:#b4b9ae}.layout{width:min(880px,100%);margin:0 auto;padding:36px 24px 110px;flex:1}.heading{display:flex;justify-content:space-between;align-items:end;margin-bottom:22px;gap:20px}.heading h1{font-size:23px;line-height:1.4;letter-spacing:.02em;font-weight:600;margin:0 0 4px}.sub{font-size:13px;color:var(--muted)}.progress{font-variant-numeric:tabular-nums;font-size:13px;color:#6f736b;white-space:nowrap}.progress strong{font-size:17px;color:var(--ink);font-weight:600}.meter{height:3px;background:#e8e9e4;border-radius:8px;margin-bottom:21px;overflow:hidden}.meter span{height:100%;display:block;width:0;background:#718775;transition:width .2s}.review-card{background:var(--panel);border:1px solid var(--line);border-radius:12px;box-shadow:0 2px 8px #30382005;overflow:hidden}.card-head{height:48px;border-bottom:1px solid #eeefeb;padding:0 20px;display:flex;align-items:center;justify-content:space-between;color:var(--muted);font-size:12px}.row-id{color:#85887f;font-variant-numeric:tabular-nums}.state-label{display:flex;align-items:center;gap:6px}.state-label.done{color:#53745a}.state-label.done:before{content:"✓"}.source{padding:26px 24px 22px;font-size:17px;line-height:2.15;min-height:164px;user-select:text;-webkit-user-select:text;touch-action:pan-y}.source::selection{background:#dce9dc}.source mark{background:transparent;color:var(--green);border-bottom:1px solid #a8c3ac;border-radius:2px;cursor:pointer;padding:0 1px}.source del{color:#a3a59f;text-decoration-thickness:1.5px;text-decoration-color:#a3a59f}.source ins{color:var(--green);text-decoration:none;font-weight:500;background:#f1f6f0;border-radius:3px;padding:0 2px}.annotation{display:inline}.hint{font-size:12px;color:#969990;padding:0 24px 20px}.annotations{border-top:1px solid #eeefeb;padding:0 20px}.annotation-row{padding:12px 2px;display:grid;grid-template-columns:22px 1fr auto;gap:9px;align-items:start;border-bottom:1px solid #f0f0ed}.annotation-row:last-child{border-bottom:0}.annotation-index{color:#a2a49e;font-size:11px;padding-top:2px}.annotation-copy{font-size:13px;line-height:1.7;min-width:0}.annotation-copy .before{color:#999b96;text-decoration:line-through}.annotation-copy .after{color:var(--green);font-weight:500}.reason-tag{display:block;color:#858a80;font-size:11px;margin-top:2px}.edit-link{border:0;background:none;color:#8a8e84;font-size:12px;padding:3px 0;cursor:pointer}.edit-link:hover{color:var(--accent)}.nav{display:flex;align-items:center;justify-content:space-between;margin-top:18px}.nav button{border:1px solid var(--line);background:#fff;padding:8px 14px;border-radius:8px;cursor:pointer;font-size:13px}.nav button:disabled{opacity:.35;cursor:default}.key-hint{font-size:11px;color:#a0a199}.empty{padding:90px 20px;text-align:center;color:var(--muted)}.empty strong{display:block;color:#45483f;font-size:17px;font-weight:500;margin-bottom:5px}.modal-backdrop{position:fixed;inset:0;background:#20251e55;display:grid;place-items:center;padding:18px;z-index:10}.modal{width:min(460px,100%);background:#fff;border-radius:14px;padding:24px;box-shadow:var(--shadow)}.modal h2{font-size:17px;font-weight:600;margin:0 0 5px}.selected-preview{padding:9px 11px;margin:15px 0 16px;background:#f5f6f2;border-radius:7px;font-size:13px;color:#73776d;max-height:65px;overflow:auto}.field-label{display:block;font-size:12px;font-weight:600;color:#6c7067;margin:13px 0 5px}.field{width:100%;border:1px solid #dfe1da;border-radius:7px;padding:10px 11px;outline:none;color:var(--ink);background:#fff}.field:focus{border-color:#829685;box-shadow:0 0 0 3px #6c8b711a}.reason-wrap{position:relative}.suggestions{position:absolute;top:100%;left:0;right:0;background:#fff;border:1px solid var(--line);border-radius:8px;box-shadow:var(--shadow);z-index:2;max-height:180px;overflow:auto}.suggestion{padding:8px 11px;cursor:pointer;font-size:13px}.suggestion:hover,.suggestion.active{background:#f0f3ed}.modal-actions{display:flex;justify-content:space-between;align-items:center;margin-top:21px}.modal-actions-right{display:flex;gap:8px}.text-button{border:0;background:none;color:#999;font-size:12px;cursor:pointer;padding:8px}.cancel-button,.save-button{border:1px solid var(--line);background:#fff;border-radius:7px;padding:8px 15px;font-size:13px;cursor:pointer}.save-button{background:var(--accent);border-color:var(--accent);color:#fff}.save-button:disabled{opacity:.4}.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:#2f3b32;color:#fff;padding:9px 15px;border-radius:8px;font-size:12px;z-index:20;box-shadow:var(--shadow)}.error{margin:20px auto;max-width:650px;padding:18px;color:#8b3737;background:#fff1ef;border:1px solid #f0d3ce;border-radius:9px;font-size:14px}
    .save-action{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:46px;padding:10px 16px;border:2px solid #2e4736;border-radius:9px;background:var(--accent);color:#fff;font-weight:700;font-size:15px;letter-spacing:.01em;cursor:pointer;box-shadow:0 2px 0 #2e4736}.save-action:hover{background:#304b38}.save-action:focus-visible{outline:3px solid #9db8a2;outline-offset:3px}.save-action[hidden]{display:none}.reset-action{border:0;background:transparent;color:#a0a39b;font-size:11px;padding:5px 2px;cursor:pointer}.reset-action:hover{color:#8b4b3c}.reset-action:focus-visible{outline:2px solid #d3a294;outline-offset:3px}.reset-action[hidden]{display:none}
    @media(max-width:600px){.topbar{height:56px;padding:0 16px}.layout{padding:26px 14px calc(88px + env(safe-area-inset-bottom))}.heading{align-items:start;margin-bottom:17px}.heading h1{font-size:20px}.source{padding:20px 17px 17px;font-size:16px;line-height:2;min-height:150px}.hint{padding:0 17px 17px}.card-head{padding:0 16px}.annotations{padding:0 15px}.nav button{padding:9px 13px}.key-hint{display:none}.modal{padding:20px}.top-actions{gap:8px}.save-state{display:none}.save-action{min-height:42px;padding:8px 10px;font-size:13px}}
    @media(max-width:360px){.topbar{padding:0 10px}.brand{font-size:12px}.save-action{padding:7px 8px;font-size:12px}}
  </style>
</head>
<body>
  <div class="app" id="app"><header class="topbar"><div class="brand">インタビュー発話のマスキング</div><div class="top-actions"><span class="save-state" id="saveState">待機中</span><button class="reset-action" id="resetButton" type="button" title="自動保存データを削除して初期画面に戻る" hidden>最初からやり直す</button><button class="save-action" id="downloadButton" type="button" aria-label="アノテーション結果をローカルに保存" title="アノテーション結果をローカルに保存" hidden>保存</button></div></header><main class="layout" id="main"></main></div>
  <script>
  (()=>{
    const main=document.getElementById('main'), saveState=document.getElementById('saveState'), BACKUP_KEY='annotation_backup_data';
    let rows=[], notes={}, index=0, selection=null, editorDraft=null, reasonHistory=[], startRow=1, fileName='', outputName='annotation_result.json', outputFormat='json', started=false;
    const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
    function parseCsv(text){const records=[];let row=[],cell='',quoted=false;for(let i=0;i<text.length;i++){const c=text[i];if(quoted){if(c==='"'&&text[i+1]==='"'){cell+='"';i++}else if(c==='"')quoted=false;else cell+=c}else if(c==='"')quoted=true;else if(c===','){row.push(cell);cell=''}else if(c==='\n'||c==='\r'){if(c==='\r'&&text[i+1]==='\n')i++;row.push(cell);if(row.some(v=>v.trim()))records.push(row);row=[];cell=''}else cell+=c}if(cell.length||row.length){row.push(cell);if(row.some(v=>v.trim()))records.push(row)}return records.map(r=>r[0]||'').filter(s=>s.trim())}
    function recordsFromNotes(){const out=[];for(const [key,list] of Object.entries(notes)){const rowIndex=Number(key),original=rows[rowIndex];if(typeof original!=='string')continue;for(const a of list||[])out.push({id:rowIndex+1,original_text:original,modified_text:original.slice(a.start,a.end),replacement:a.replacement,reason:a.reason||'',start:a.start,end:a.end})}return out.sort((a,b)=>a.id-b.id||a.start-b.start)}
    function yamlText(){const records=recordsFromNotes();if(!records.length)return 'annotations: []\n';const quote=x=>JSON.stringify(String(x));return 'annotations:\n'+records.map(r=>`  - id: ${r.id}\n    original_text: ${quote(r.original_text)}\n    modified_text: ${quote(r.modified_text)}\n    replacement: ${quote(r.replacement)}\n    reason: ${quote(r.reason)}\n    start: ${r.start}\n    end: ${r.end}`).join('\n')+'\n'}
    function getNotes(i=index){return notes[String(i)]||[]}
    function persist(){if(!rows.length||!fileName)return;const annotation_state={rows,notes,index,start_row:startRow,started,selection,editor_draft:editorDraft,reason_history:reasonHistory,output_name:outputName,output_format:outputFormat};try{localStorage.setItem(BACKUP_KEY,JSON.stringify({file_name:fileName,annotation_state,updated_at:new Date().toISOString()}))}catch(e){console.error('Annotation backup could not be written to localStorage.',e)}}
    function queueSave(){persist()}
    function validatedNotes(candidate,dataRows){const result={};if(!candidate||typeof candidate!=='object')return result;for(let i=0;i<dataRows.length;i++){const list=candidate[String(i)];if(!Array.isArray(list))continue;const valid=list.filter(a=>a&&Number.isInteger(a.start)&&Number.isInteger(a.end)&&a.start>=0&&a.end<=dataRows[i].length&&a.start<a.end&&dataRows[i].slice(a.start,a.end)===a.original&&typeof a.replacement==='string'&&a.replacement.trim()).map(a=>({id:String(a.id||crypto.randomUUID()),start:a.start,end:a.end,original:a.original,replacement:a.replacement,reason:String(a.reason||'')}));if(valid.length)result[String(i)]=valid}return result}
    function restoreBackup(){try{const backup=JSON.parse(localStorage.getItem(BACKUP_KEY)||'null'),state=backup?.annotation_state;if(!backup||typeof backup.file_name!=='string'||!state||!Array.isArray(state.rows)||!state.rows.length||!state.rows.every(x=>typeof x==='string'))return false;fileName=backup.file_name;rows=state.rows;notes=validatedNotes(state.notes,rows);reasonHistory=Array.isArray(state.reason_history)?state.reason_history.filter(x=>typeof x==='string').slice(0,30):[];startRow=Math.max(1,Math.min(rows.length,Number(state.start_row)||1));index=Math.max(startRow-1,Math.min(rows.length-1,Number(state.index)||startRow-1));selection=state.selection&&Number.isInteger(state.selection.start)&&Number.isInteger(state.selection.end)&&state.selection.start>=0&&state.selection.end<=rows[index].length&&state.selection.original===rows[index].slice(state.selection.start,state.selection.end)?state.selection:null;editorDraft=state.editor_draft&&typeof state.editor_draft==='object'?state.editor_draft:null;outputName=typeof state.output_name==='string'?state.output_name:'annotation_result.json';outputFormat=state.output_format==='yaml'?'yaml':'json';started=state.started!==false;return true}catch(e){console.error('Annotation backup could not be restored from localStorage.',e);return false}}
    function resetBackup(){try{localStorage.removeItem(BACKUP_KEY)}catch(e){console.error('Previous annotation backup could not be removed from localStorage.',e)}}
    function renderText(i){const text=rows[i],list=[...getNotes(i)].sort((a,b)=>a.start-b.start);let out='',at=0;for(const a of list){if(a.start<at||a.start<0||a.end>text.length)continue;out+=esc(text.slice(at,a.start))+`<span class="annotation" data-note="${esc(a.id)}"><del>${esc(text.slice(a.start,a.end))}</del><ins>${esc(a.replacement)}</ins></span>`;at=a.end}return out+esc(text.slice(at))}
    function render(){if(!rows.length)return;index=Math.max(startRow-1,Math.min(index,rows.length-1));const list=getNotes(), done=list.length>0, pct=Math.round((Object.keys(notes).filter(k=>notes[k]?.length).length/Math.max(1,rows.length-startRow+1))*100);main.innerHTML=`<div class="heading"><div><h1>内容を確認する</h1><div class="sub">隠したい箇所を選択して、置き換え内容を入力</div></div><div class="progress"><strong>${index+1}</strong> / ${rows.length}</div></div><div class="meter"><span style="width:${pct}%"></span></div><section class="review-card"><div class="card-head"><span class="row-id">記録 ${String(index+1).padStart(3,'0')}</span><span class="state-label ${done?'done':''}">${done?'注釈あり':'未注釈'}</span></div><div class="source" id="sourceText">${renderText(index)}</div><div class="hint">文中の箇所を選択すると、置き換えを追加できます。既存の注釈をタップすると編集できます。</div>${list.length?`<div class="annotations">${list.map((a,n)=>`<div class="annotation-row"><span class="annotation-index">${String(n+1).padStart(2,'0')}</span><div class="annotation-copy"><span class="before">${esc(a.original)}</span> → <span class="after">${esc(a.replacement)}</span>${a.reason?`<span class="reason-tag">${esc(a.reason)}</span>`:''}</div><button class="edit-link" data-edit="${esc(a.id)}">編集</button></div>`).join('')}</div>`:''}</section><div class="nav"><button type="button" id="previous" ${index<=startRow-1?'disabled':''}>← 前へ</button><span class="key-hint">← → キーで移動</span><button type="button" id="next" ${index===rows.length-1?'disabled':''}>次へ →</button></div><section class="review-card" style="margin-top:18px;padding:16px 20px;display:flex;gap:10px;align-items:end;flex-wrap:wrap"><label style="flex:1;min-width:180px"><span class="field-label">出力ファイル名</span><input class="field" id="outputName" value="${esc(outputName)}"></label><label><span class="field-label">形式</span><select class="field" id="outputFormat"><option value="json" ${outputFormat==='json'?'selected':''}>JSON</option><option value="yaml" ${outputFormat==='yaml'?'selected':''}>YAML</option></select></label></section>`;
      document.getElementById('previous').onclick=()=>move(-1);document.getElementById('next').onclick=()=>move(1);document.getElementById('outputName').oninput=e=>{outputName=e.target.value;persist()};document.getElementById('outputFormat').onchange=e=>{outputFormat=e.target.value;persist()};document.querySelectorAll('[data-edit]').forEach(b=>b.onclick=()=>editNote(b.dataset.edit));document.querySelectorAll('[data-note]').forEach(el=>el.onclick=()=>editNote(el.dataset.note));
      const source=document.getElementById('sourceText');source.onmouseup=()=>capture(source);source.ontouchend=()=>setTimeout(()=>capture(source),80);
    }
    function move(d){index=Math.max(startRow-1,Math.min(rows.length-1,index+d));render();persist();window.scrollTo({top:0,behavior:'smooth'})}
    document.addEventListener('keydown',e=>{if(document.querySelector('.modal-backdrop'))return;if(e.key==='ArrowLeft')move(-1);if(e.key==='ArrowRight')move(1)});
    function offsetAt(root,node,offset){let count=0,found=false;const walker=document.createTreeWalker(root,NodeFilter.SHOW_TEXT);while(walker.nextNode()){const current=walker.currentNode,ignored=!!current.parentElement?.closest('ins');if(current===node){if(!ignored)count+=offset;found=true;break}if(!ignored)count+=current.textContent.length}return found?count:null}
    function capture(root){const sel=getSelection();if(!sel||sel.isCollapsed||!sel.rangeCount)return;const r=sel.getRangeAt(0);if(!root.contains(r.startContainer)||!root.contains(r.endContainer))return;const start=offsetAt(root,r.startContainer,r.startOffset),end=offsetAt(root,r.endContainer,r.endOffset);if(start===null||end===null||start===end)return;const a=Math.min(start,end),b=Math.max(start,end);if(b>rows[index].length)return;const collision=getNotes().some(n=>a<n.end&&b>n.start);if(collision){showToast('既存の注釈と重なる範囲は選択できません');return}selection={start:a,end:b,original:rows[index].slice(a,b)};sel.removeAllRanges();openEditor(null)}
    function openEditor(note){
      const editing=!!note, draftMatches=editorDraft&&(editing?editorDraft.noteId===note.id:!editorDraft.noteId);
      const initialReplacement=draftMatches?String(editorDraft.replacement||''):String(note?.replacement||''), initialReason=draftMatches?String(editorDraft.reason||''):String(note?.reason||'');
      const overlay=document.createElement('div');overlay.className='modal-backdrop';
      overlay.innerHTML=`<section class="modal" role="dialog" aria-modal="true"><h2>${editing?'注釈を編集':'置き換えを追加'}</h2><div class="selected-preview">${esc(note?note.original:selection.original)}</div><label class="field-label" for="replacement">置き換え後</label><input class="field" id="replacement" autocomplete="off" placeholder="置き換え後の文" value="${esc(initialReplacement)}"><label class="field-label" for="reason">理由 <span style="font-weight:400;color:#9a9c95">（任意）</span></label><div class="reason-wrap"><input class="field" id="reason" autocomplete="off" placeholder="例：個人情報を含む" value="${esc(initialReason)}"><div class="suggestions" id="suggestions" hidden></div></div><div class="modal-actions">${editing?'<button class="text-button" id="deleteNote">削除</button>':'<span></span>'}<div class="modal-actions-right"><button class="cancel-button" id="cancel">キャンセル</button><button class="save-button" id="saveNote">保存</button></div></div></section>`;
      document.body.append(overlay);const replacement=overlay.querySelector('#replacement'),reason=overlay.querySelector('#reason'),suggestions=overlay.querySelector('#suggestions');let active=-1;
      const saveEditorDraft=()=>{editorDraft={noteId:note?.id||null,replacement:replacement.value,reason:reason.value};persist()};
      const updateSuggestions=()=>{const q=reason.value.trim().toLocaleLowerCase();const opts=reasonHistory.filter(x=>x.toLocaleLowerCase().includes(q)&&x!==reason.value).slice(0,6);suggestions.innerHTML=opts.map((x,i)=>`<div class="suggestion ${i===active?'active':''}" data-value="${esc(x)}">${esc(x)}</div>`).join('');suggestions.hidden=!opts.length;suggestions.querySelectorAll('.suggestion').forEach(el=>el.onpointerdown=e=>{e.preventDefault();reason.value=el.dataset.value;suggestions.hidden=true;saveEditorDraft();reason.focus()})};
      replacement.oninput=saveEditorDraft;reason.oninput=()=>{active=-1;updateSuggestions();saveEditorDraft()};reason.onfocus=updateSuggestions;
      reason.onkeydown=e=>{const items=[...suggestions.querySelectorAll('.suggestion')];if(e.key==='ArrowDown'&&items.length){e.preventDefault();active=(active+1)%items.length;updateSuggestions()}else if(e.key==='ArrowUp'&&items.length){e.preventDefault();active=(active-1+items.length)%items.length;updateSuggestions()}else if(e.key==='Tab'&&items.length){const chosen=items[active>=0?active:0];if(chosen){e.preventDefault();reason.value=chosen.dataset.value;suggestions.hidden=true;saveEditorDraft()}}else if(e.key==='Enter'&&items.length){e.preventDefault();const chosen=items[active>=0?active:0];reason.value=chosen.dataset.value;suggestions.hidden=true;saveEditorDraft()}};
      const cancelEditor=()=>{editorDraft=null;selection=null;overlay.remove();persist()};overlay.querySelector('#cancel').onclick=cancelEditor;overlay.onclick=e=>{if(e.target===overlay)cancelEditor()};
      overlay.querySelector('#saveNote').onclick=()=>{const value=replacement.value.trim();if(!value){replacement.focus();return}const a=note?{...note,replacement:value,reason:reason.value.trim()}:{id:crypto.randomUUID(),start:selection.start,end:selection.end,original:selection.original,replacement:value,reason:reason.value.trim()};const ns=getNotes().filter(n=>n.id!==note?.id);ns.push(a);ns.sort((x,y)=>x.start-y.start);notes[String(index)]=ns;if(a.reason&&!reasonHistory.includes(a.reason)){reasonHistory.unshift(a.reason);reasonHistory=reasonHistory.slice(0,30)}editorDraft=null;overlay.remove();selection=null;render();queueSave()};
      const del=overlay.querySelector('#deleteNote');if(del)del.onclick=()=>{notes[String(index)]=getNotes().filter(n=>n.id!==note.id);editorDraft=null;selection=null;overlay.remove();render();queueSave()};
      saveEditorDraft();replacement.focus();replacement.select();
    }
    function editNote(id){const note=getNotes().find(a=>a.id===id);if(note)openEditor(note)}
    function showToast(message){const old=document.querySelector('.toast');if(old)old.remove();const el=document.createElement('div');el.className='toast';el.textContent=message;document.body.append(el);setTimeout(()=>el.remove(),2600)}
    document.getElementById('downloadButton').onclick=()=>{const format=document.getElementById('outputFormat')?.value||'yaml',name=(document.getElementById('outputName')?.value||`annotation_result.${format}`).trim();const filename=name.toLowerCase().endsWith(`.${format}`)?name:`${name.replace(/\.[^.]+$/,'')}.${format}`;const data=format==='json'?JSON.stringify({annotations:recordsFromNotes()},null,2)+'\n':yamlText();const blob=new Blob([data],{type:format==='json'?'application/json;charset=utf-8':'text/yaml;charset=utf-8'});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=filename;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000);saveState.textContent='保存済み';saveState.style.color=''};
    function setup(){
      main.innerHTML=`<article class="review-card" style="padding:clamp(20px,4vw,34px)">
        <div style="display:flex;justify-content:space-between;align-items:start;gap:12px;flex-wrap:wrap"><h1 style="font-size:23px;margin:0 0 12px">インタビュー発話のマスキング</h1><a class="icon-button" href="README.pdf" download>手順書PDF</a></div>
        <p><strong>重要：Webページを閉じる前に必ず「保存」ボタンを押して結果を出力してください。</strong></p>
        <p>画面例は説明用の架空の発話です。実際の作業では、お送りした <code>interview.csv</code> を使用してください。</p>
        <h2 style="font-size:19px;margin:24px 0 8px">作業手順</h2>
        <ol style="padding-left:24px;margin:0">
          <li>お送りした <code>interview.csv</code> をお手元に用意します。</li>
          <li>Webページの案内を確認して「OK」を押し、「ファイルを選択」から <code>interview.csv</code> を選びます。</li>
          <li>作業を始める行番号を入力して「アノテーション開始」を押します。行番号は1から数えます。</li>
          <li>発話中の隠したい箇所をドラッグして選択します。
            <figure style="margin:12px 0 20px"><img src="manual_screenshots/step-4.svg" alt="発話中のマスキング箇所を選択した画面例" style="display:block;width:100%;height:auto;border:1px solid var(--line);border-radius:8px"><figcaption class="sub">例：「東京本社」をドラッグして選択します。</figcaption></figure>
          </li>
          <li>置き換え後の文字列を入力します。理由は必要に応じて入力し、注釈を保存します。
            <figure style="margin:12px 0 20px"><img src="manual_screenshots/step-5.svg" alt="置き換え後の文字列と理由を入力する画面例" style="display:block;width:100%;height:auto;border:1px solid var(--line);border-radius:8px"><figcaption class="sub">選択した箇所と置き換え後の文字列を確認して保存します。</figcaption></figure>
          </li>
          <li>同じ発話にほかの対象箇所があれば、同じ手順で注釈を追加します。
            <figure style="margin:12px 0 20px"><img src="manual_screenshots/step-6.svg" alt="同じ発話の2箇所に注釈を付けた画面例" style="display:block;width:100%;height:auto;border:1px solid var(--line);border-radius:8px"><figcaption class="sub">同じ発話に2箇所の注釈を付けた例です。</figcaption></figure>
          </li>
          <li>「前へ」「次へ」、またはキーボードの左右キーで発話を移動して作業します。既存の注釈はクリックして編集できます。</li>
          <li>作業後、出力形式とファイル名を確認し、画面右上の「保存」を押します。
            <figure style="margin:12px 0 20px"><img src="manual_screenshots/step-8.svg" alt="出力形式とファイル名を確認して保存する画面例" style="display:block;width:100%;height:auto;border:1px solid var(--line);border-radius:8px"><figcaption class="sub">出力形式・ファイル名を確認し、画面右上の「保存」を押します。</figcaption></figure>
          </li>
          <li>ローカルに保存されたアノテーション結果ファイルをお送りください。</li>
        </ol>
        <h2 style="font-size:19px;margin:24px 0 8px">回答済みのデータを訂正する場合</h2>
        <ul style="padding-left:24px;margin:0"><li>注釈の内容を訂正する場合は、「前へ」で該当の発話に戻り、発話中の注釈または一覧の「編集」をクリックして、置き換え後の文字列を修正して保存します。<figure style="margin:12px 0 20px"><img src="manual_screenshots/step-7-edit.svg" alt="回答済みデータの注釈を編集する画面例" style="display:block;width:100%;height:auto;border:1px solid var(--line);border-radius:8px"><figcaption class="sub">「前へ」で戻り、訂正したい注釈の「編集」を押します。</figcaption></figure></li><li>注釈を付ける前の状態に戻す場合は、同じ編集画面の「削除」を押してください。注釈が取り消され、元の発話に戻ります。<figure style="margin:12px 0 20px"><img src="manual_screenshots/step-7-restore.svg" alt="注釈を削除して元の状態に戻す画面例" style="display:block;width:100%;height:auto;border:1px solid var(--line);border-radius:8px"><figcaption class="sub">「削除」を押すと、その注釈だけを取り消せます。</figcaption></figure></li><li>最初からやり直す場合は、必要な注釈を必ず「保存」で結果ファイルに出力してから、画面右上端の小さな「最初からやり直す」を押します。確認後に自動保存データが削除され、初期画面へ戻ります。その後、CSVと開始番号を選び直してください。<figure style="margin:12px 0 20px"><img src="manual_screenshots/step-7-reset.svg" alt="最初からやり直す画面例" style="display:block;width:100%;height:auto;border:1px solid var(--line);border-radius:8px"><figcaption class="sub">「最初からやり直す」を使う前に、必ず「保存」で結果ファイルを出力してください。</figcaption></figure></li></ul>
        <h2 style="font-size:19px;margin:24px 0 8px">注意事項</h2>
        <ul style="padding-left:24px;margin:0"><li>データは全部で571件です。途中から作業する場合は、手順3で開始番号を指定してください。たとえば250件目から最後まで作業する場合は「250」を入力します。</li><li>作業する範囲の最後まで進んだら、「保存」を押して終了してください。たとえば250件目から350件目まで作業する場合は、250から開始し、350件目の作業後に保存します。</li><li>開始番号より前の発話には戻れません。</li><li>保存すると、作業中に付けた注釈がファイルとしてダウンロードされます。既定の形式はJSON、ファイル名は <code>annotation_result.json</code> です。必要に応じてYAMLや別のファイル名に変更できます。</li></ul>
        <h2 style="font-size:19px;margin:24px 0 8px">お願い</h2>
        <p>マスキングによる情報損失をできるだけ抑えられるよう、可能な範囲で単語単位に、マスキング箇所を最小限にしていただけると助かります。</p>
        <h2 style="font-size:19px;margin:24px 0 8px">CSVについて</h2>
        <ul style="padding-left:24px;margin:0"><li>アノテーション対象は、お送りした <code>interview.csv</code> です。</li></ul>
        <h2 style="font-size:19px;margin:24px 0 8px">データの保存</h2>
        <p>CSVと注釈データはこのブラウザのローカルストレージに自動保存されます。ページを再読み込みすると、作業中の状態が自動的に復元されます。アノテーション対象や注釈をサーバーへ送信する処理はありません。結果は「保存」を押すとローカルにダウンロードされます。ダウンロードした結果ファイルをお送りください。</p>
        <div style="text-align:center;margin-top:24px"><p class="sub">内容を最後まで確認したら「OK」を押して、CSV選択に進んでください。</p><button class="save-button" id="guideOk" type="button">OK</button></div>
      </article>`;
      main.querySelector('#guideOk').onclick=showUploadScreen;
    }
    function startAnnotation(){if(!rows.length)return;startRow=Math.max(1,Math.min(rows.length,Number(main.querySelector('#startRow').value)||1));index=startRow-1;started=true;render();document.getElementById('downloadButton').hidden=false;document.getElementById('resetButton').hidden=false;persist()}
    function resetToGuide(){if(!window.confirm('自動保存された作業内容を削除して、最初からやり直しますか？\nこの操作は取り消せません。'))return;resetBackup();rows=[];notes={};index=0;selection=null;editorDraft=null;reasonHistory=[];startRow=1;fileName='';outputName='annotation_result.json';outputFormat='json';started=false;document.getElementById('downloadButton').hidden=true;document.getElementById('resetButton').hidden=true;document.getElementById('saveState').textContent='待機中';setup()}
    function showUploadScreen(){
      main.innerHTML=`<section class="review-card" style="padding:24px"><h1 style="font-size:21px;margin:0 0 8px">CSVを読み込む</h1><p class="sub">お送りした interview.csv を選択してください。CSVと注釈はこのブラウザ内に保存され、サーバーには送信されません。</p><label class="field-label" for="csvPicker">ファイルを選択（interview.csv）</label><input class="field" id="csvPicker" type="file" accept=".csv,text/csv"><div id="rangeSetup" hidden><label class="field-label" for="startRow">開始する行番号（CSVのデータ行、1始まり）</label><input class="field" id="startRow" type="number" min="1" value="1"><p><button class="save-button" id="begin" type="button">アノテーション開始</button></p></div></section>`;
      const picker=main.querySelector('#csvPicker'),range=main.querySelector('#rangeSetup');main.querySelector('#begin').onclick=startAnnotation;
      picker.onchange=async()=>{
        if(!picker.files[0])return;
        let parsed;try{parsed=parseCsv(await picker.files[0].text())}catch(e){console.error('The selected CSV could not be read.',e);showToast('CSVを読み込めませんでした');return}
        if(!parsed.length){showToast('CSVから文章を読み込めませんでした');return}
        resetBackup();rows=parsed;fileName=picker.files[0].name;notes={};reasonHistory=[];index=0;startRow=1;started=false;selection=null;editorDraft=null;outputName='annotation_result.json';outputFormat='json';
        range.hidden=false;main.querySelector('#startRow').max=rows.length;persist();
      };
    }
    document.getElementById('resetButton').onclick=resetToGuide;
    function init(){if(restoreBackup()){if(started){render();document.getElementById('downloadButton').hidden=false;document.getElementById('resetButton').hidden=false;if(editorDraft){const note=editorDraft.noteId?getNotes().find(a=>a.id===editorDraft.noteId):null;if((editorDraft.noteId&&note)||(!editorDraft.noteId&&selection))openEditor(note)}}else{showUploadScreen();const range=main.querySelector('#rangeSetup');range.hidden=false;main.querySelector('#startRow').max=rows.length;main.querySelector('#startRow').value=startRow}}else setup()}
    init();
  })();
  </script>
</body>
</html>
